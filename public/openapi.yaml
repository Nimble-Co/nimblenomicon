components:
  schemas:
    AdventuringMotivationsItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
      required:
        - name
        - description
      additionalProperties: false
    AncestriesItem:
      type: object
      properties:
        section:
          type: string
          enum:
            - common
            - exotic
        name:
          type: string
          minLength: 1
        size:
          type: string
          enum:
            - small
            - medium
            - large
            - small-and-medium
        flavor:
          type: string
        trait:
          type: string
      required:
        - section
        - name
        - size
        - flavor
        - trait
      additionalProperties: false
    ArmorItem:
      type: object
      properties:
        category:
          type: string
          enum:
            - cloth
            - leather
            - plate
            - mail
            - shields
        name:
          type: string
          minLength: 1
        armor:
          type: string
          minLength: 1
        cost:
          type: string
          minLength: 1
      required:
        - category
        - name
        - armor
        - cost
      additionalProperties: false
    BackgroundsItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    CharacterClassesItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Lowercase class name as stored in JSON
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    ConditionsItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    CoreRulesSidebarItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        collapsed:
          type: boolean
        items:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
              anchor:
                type: string
                minLength: 1
            required:
              - name
              - anchor
            additionalProperties: false
      required:
        - name
        - collapsed
        - items
      additionalProperties: false
    CoreRulesSnippetsItem:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
      required:
        - id
        - description
      additionalProperties: false
    DcExamplesItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
      required:
        - name
        - description
      additionalProperties: false
    DowntimeActivitiesItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    GlossaryItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    LanguagesItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    MagicalItemRaritiesItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        availability:
          type: string
          minLength: 1
        cost:
          type: string
          minLength: 1
      required:
        - name
        - availability
        - cost
      additionalProperties: false
    MagicalItemsItem:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - standard
            name:
              type: string
              minLength: 1
            subtitle:
              type: string
            description:
              type: string
              minLength: 1
          required:
            - kind
            - name
            - description
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - wand
            name:
              type: string
              minLength: 1
            subtitle:
              type: string
            description:
              type: string
              minLength: 1
          required:
            - kind
            - name
            - description
          additionalProperties: false
    MiscAdventuringEquipmentItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        cost:
          type: string
          minLength: 1
      required:
        - name
        - description
        - cost
      additionalProperties: false
    OptionalVariantRulesItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    SaveTypesItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    SizesItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    SkillsItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        stat:
          type: string
          enum:
            - STR
            - DEX
            - INT
            - WIL
        description:
          type: string
      required:
        - name
        - stat
        - description
      additionalProperties: false
    SpellSchoolsItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    SpellScrollCostsItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        cost:
          type: string
          minLength: 1
      required:
        - name
        - cost
      additionalProperties: false
    SpellsItem:
      type: object
      properties:
        schoolId:
          type: string
          enum:
            - fire-spells
            - ice-spells
            - lightning-spells
            - wind-spells
            - radiant-spells
            - necrotic-spells
        utility:
          type: boolean
        name:
          type: string
          minLength: 1
        castingTime:
          type: string
          minLength: 1
        target:
          type: string
          enum:
            - single-target
            - self
            - aoe
            - two-targets
            - multi-target
            - single-target-plus
            - single-target-or-self
        description:
          type: string
        tier:
          type: integer
          minimum: 0
          maximum: 9
        level:
          type: integer
          minimum: 0
          maximum: 9
      required:
        - schoolId
        - utility
        - name
        - castingTime
        - target
        - description
        - tier
      additionalProperties: false
    StatArraysItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    StatsItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        stat:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - stat
        - description
      additionalProperties: false
    WandCostsItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        cost:
          type: string
          minLength: 1
      required:
        - name
        - cost
      additionalProperties: false
    WeaponPropertiesItem:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name
        - description
      additionalProperties: false
    WeaponsItem:
      type: object
      properties:
        category:
          type: string
          enum:
            - melee
            - ranged
        name:
          type: string
          minLength: 1
        damage:
          type: string
          minLength: 1
        propertyLines:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
                minLength: 1
            required:
              - description
            additionalProperties: false
        cost:
          type: string
          minLength: 1
      required:
        - category
        - name
        - damage
        - propertyLines
        - cost
      additionalProperties: false
    CollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            type: string
      required:
        - collections
      additionalProperties: false
