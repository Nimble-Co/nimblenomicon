openapi: 3.0.3
info:
  title: Nimblenomicon Data API
  version: 1.0.0
  description: >-
    Static JSON API for Nimble RPG reference data. Responses are the raw contents of
    `src/data/*.json` (no derived `id` fields that the site adds when parsing).


    Each collection is available at `GET /api/{collection}` plus a dedicated path per dataset. When
    the site uses a path prefix (for example GitHub project pages), prefix these paths with that
    base URL.


    Discovery: `GET /api/collections` (a bare `GET /api` is not used so static hosting can emit both
    a directory and leaf files under `/api/`).
servers:
  - url: /
    description:
      Relative to the deployed site root (include the repository path segment for GitHub
      project pages when applicable).
paths:
  /api/collections:
    get:
      summary: List available collections
      operationId: listCollections
      responses:
        '200':
          description: Sorted list of collection identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionsResponse'
        '404':
          description: Unknown collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                additionalProperties: false
  /api/adventuring-motivations:
    get:
      summary: Get Adventuring Motivations
      operationId: getAdventuringMotivations
      description: Same JSON as `src/data/adventuring-motivations.json` (top-level array).
      responses:
        '200':
          description: Array of `AdventuringMotivationsItem` records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdventuringMotivationsItem'
