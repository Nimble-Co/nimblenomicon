          - name: isMinion
            label: Is Minion
            type: boolean
            required: true
            description: True when the creature is a minion (no HP to track when hp is omitted).
          - name: size
            label: Size
            type: select
            required: true
            description: Default is Medium if omitted in raw JSON; CMS must pick one.
            options:
              values:
                - name: tiny
                  label: Tiny
                - name: small
                  label: Small
                - name: medium
                  label: Medium
                - name: large
                  label: Large
                - name: huge
                  label: Huge
                - name: gargantuan
                  label: Gargantuan
          - name: hp
            label: HP
            type: number
            required: false
            description: Omit for minions (no HP to track).
          - name: armor
            label: Armor
            type: select
            required: true
            options:
              values:
                - name: none
                  label: None
                - name: medium
                  label: Medium
                - name: heavy
                  label: Heavy
          - name: movement
            label: Movement
            type: object
            required: true
            fields:
              - name: speed
                label: Speed
                type: number
                required: true
                description: Default 6 when using defaults outside CMS.
              - name: mode
                label: Mode
                type: select
                required: true
                options:
                  values:
                    - name: walk
                      label: Walk
                    - name: fly
                      label: Fly
                    - name: burrow
                      label: Burrow
                    - name: swim
                      label: Swim
          - name: actions
            label: Actions
            type: object
            list: true
            required: false
            description: Stat block attacks; use Join next to recreate OR / Then / blank-line OR between rows.
            fields:
              - name: name
                label: Name
                type: string
                required: true
                description: Attack name without (2x); set Uses for multi-use.
              - name: uses
                label: Uses
                type: number
                required: false
                description: Optional; renders as (2x), (3x), etc. after the name.
              - name: description
                label: Description
                type: rich-text
                required: true
                options:
                  format: markdown
                description: Full line after the name (dice, range, riders).
              - name: joinNext
                label: Join next
                type: select
                required: false
                description: Connector toward the following action (omit on the last row).
                options:
                  values:
                    - name: or
                      label: OR (same line)
                    - name: orBreak
                      label: OR (blank line before next)
                    - name: then
                      label: Then
          - name: notes
            label: Notes
            type: rich-text
            required: false
            options:
              format: markdown
            description: Optional text after actions (e.g. mimic disguises).
          - name: specialAbilities
            label: Special Abilities
            type: object
            list: true
            required: false
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: description
                label: Description
                type: rich-text
                required: true
                options:
                  format: markdown
          - name: specialCondition
            label: Special Condition
            type: object
            required: false
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: description
                label: Description
                type: rich-text
                required: true
                options:
                  format: markdown
          - name: kind
            label: Monster Kind
            type: select
            required: false
            description: Must match a monster kind id. Add a select option when you add a kind.
            options:
              values:
                - name: bandits
                  label: Bandits
                - name: cultists-and-horrors
                  label: Cultists & Horrors
                - name: dungeon-denizens
                  label: Dungeon Denizens
                - name: forest-denizens
