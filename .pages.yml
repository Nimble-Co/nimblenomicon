# Pages CMS — https://pagescms.org/docs/configuration
# Media: https://pagescms.org/docs/configuration/media/
media:
  label: Assets
  input: src/assets
  output: /assets
  extensions: [avif, gif, jpeg, jpg, png, svg, webp]

content:
  - name: stats
    label: Stats
    type: file
    path: src/data/stats.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: stat
        label: Stat code
        type: string
        required: true
        description: Any short code you use for this stat (e.g. STR). Skills link to this value.
      - name: body
        type: text
        required: true

  - name: sizes
    label: Sizes
    type: file
    path: src/data/sizes.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: skills
    label: Skills
    type: file
    path: src/data/skills.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: stat
        label: Stat code
        type: string
        required: true
        description: Must exactly match the Stat code on a row in Stats (e.g. STR). Pages CMS cannot reference file+list collections yet; the build fails if the code is not in stats.json.
      - name: body
        type: text
        required: true
      - name: callout
        label: Callout
        type: text
        required: false
        description: Optional note with HTML (e.g. Insight example boxes).

  - name: conditions
    label: Conditions
    type: file
    path: src/data/conditions.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: core-rules-start-here
    label: Core Rules — Start Here
    type: file
    path: src/data/core-rules/start-here.md
