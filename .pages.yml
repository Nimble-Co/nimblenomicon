# Pages CMS — https://pagescms.org/docs/configuration/
# Groups organize the sidebar. Rich-text content uses markdown (`format: markdown`) and is rendered with `renderMarkdown` in MDX.

media:
  label: Assets
  input: src/assets
  output: /assets
  extensions: [avif, gif, jpeg, jpg, png, svg, webp]

content:
  - name: core-rules
    label: Core Rules
    type: group
    items:
      - name: core-rules-start
        label: Start
        type: group
        items:
          - name: core-rules-start-here
            label: Start here
            type: file
            path: src/data/core-rules/start-here.md

      - name: core-rules-stats-skills
        label: Stats & skills
        type: group
        items:
          - name: stats
            label: Stats
            type: file
            path: src/data/stats.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: stat
                label: Stat code
                type: string
                required: true
                description: Short code (e.g. STR). Skills must use the same value.
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: skills
            label: Skills
            type: file
            path: src/data/skills.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: stat
                label: Stat code
                type: string
                required: true
                description: Must match a row in Stats. Build validates; CMS cannot link lists.
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: sizes
            label: Sizes
            type: file
            path: src/data/sizes.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: conditions
            label: Conditions
            type: file
            path: src/data/conditions.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

      - name: core-rules-checks
        label: Checks
        type: group
        items:
          - name: dc-examples
            label: DC examples
            type: file
            path: src/data/dc-examples.json
            format: json
            list: true
            fields:
              - name: name
                label: Difficulty label
                type: string
                required: true
              - name: body
                label: Example
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: save-types
            label: Saves
            type: file
            path: src/data/save-types.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: downtime-activities
            label: Downtime
            type: file
            path: src/data/downtime-activities.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

      - name: core-rules-character
        label: Character
        type: group
        items:
          - name: stat-arrays
            label: Stat arrays
            type: file
            path: src/data/stat-arrays.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: languages
            label: Languages
            type: file
            path: src/data/languages.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: character-classes
            label: Classes
            type: file
            path: src/data/character-classes.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: ancestries
            label: Ancestries
            type: file
            path: src/data/ancestries.json
            format: json
            list: true
            fields:
              - name: section
                type: select
                required: true
                options:
                  values:
                    - name: common
                      label: Common
                    - name: exotic
                      label: Exotic
              - name: name
                type: string
                required: true
              - name: sizeLine
                label: Size
                type: string
                required: true
              - name: flavor
                type: rich-text
                required: true
                options:
                  format: markdown
              - name: trait
                label: Trait
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: backgrounds
            label: Backgrounds
            type: file
            path: src/data/backgrounds.json
            format: json
            list: true
            fields:
              - name: name
                label: Title
                type: string
                required: true
              - name: body
                label: Description
                type: rich-text
                required: true
                description: Markdown; use blockquotes for tips.
                options:
                  format: markdown

          - name: adventuring-motivations
            label: Motivations
            type: file
            path: src/data/adventuring-motivations.json
            format: json
            list: true
            fields:
              - name: name
                label: Hook
                type: string
                required: true
              - name: body
                label: Prompts
                type: rich-text
                required: true
                options:
                  format: markdown

      - name: core-rules-equipment
        label: Equipment
        type: group
        items:
          - name: weapons
            label: Weapons
            type: file
            path: src/data/weapons.json
            format: json
            list: true
            fields:
              - name: category
                label: Table
                type: select
                required: true
                options:
                  values:
                    - name: melee
                      label: Melee
                    - name: ranged
                      label: Ranged
              - name: name
                label: Weapon
                type: string
                required: true
              - name: damage
                type: string
                required: true
              - name: properties
                type: object
                list: true
                required: false
                fields:
                  - name: text
                    type: string
                    required: true
              - name: cost
                type: string
                required: true

          - name: weapon-properties
            label: Weapon properties
            type: file
            path: src/data/weapon-properties.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: armor
            label: Armor
            type: file
            path: src/data/armor.json
            format: json
            list: true
            fields:
              - name: category
                label: Section
                type: select
                required: true
                options:
                  values:
                    - name: cloth
                      label: Cloth
                    - name: leather
                      label: Leather
                    - name: plate
                      label: Plate
                    - name: mail
                      label: Mail
                    - name: shields
                      label: Shields
              - name: name
                label: Item
                type: string
                required: true
              - name: armor
                label: Armor value
                type: string
                required: true
              - name: cost
                type: string
                required: true

          - name: misc-adventuring-equipment
            label: Misc. gear
            type: file
            path: src/data/misc-adventuring-equipment.json
            format: json
            list: true
            fields:
              - name: name
                label: Item
                type: string
                required: true
              - name: properties
                type: rich-text
                required: true
                options:
                  format: markdown
              - name: cost
                type: string
                required: true

      - name: core-rules-spells
        label: Spells
        type: group
        items:
          - name: spell-schools
            label: Spell schools
            type: file
            path: src/data/spell-schools.json
            format: json
            list: true
            fields:
              - name: name
                label: School (short name; page adds "Spells")
                type: string
                required: true
              - name: body
                type: rich-text
                required: true
                options:
                  format: markdown

          - name: spell-scroll-costs
            label: Scroll costs
            type: file
            path: src/data/spell-scroll-costs.json
            format: json
            list: true
            fields:
              - name: name
                label: Tier
                type: string
                required: true
              - name: cost
                type: string
                required: true

          - name: wand-costs
            label: Wand costs
            type: file
            path: src/data/wand-costs.json
            format: json
            list: true
            fields:
              - name: name
                label: Tier
                type: string
                required: true
              - name: cost
                type: string
                required: true

          - name: spells
            label: Spells
            type: file
            path: src/data/spells.json
            format: json
            list: true
            fields:
              - name: schoolId
                label: School
                type: select
                required: false
                description: Set for main-school spells; leave empty for utility spells.
                options:
                  values:
                    - name: fire-spells
                      label: Fire
                    - name: ice-spells
                      label: Ice
                    - name: lightning-spells
                      label: Lightning
                    - name: wind-spells
                      label: Wind
                    - name: radiant-spells
                      label: Radiant
                    - name: necrotic-spells
                      label: Necrotic
              - name: schoolName
                label: School name
                type: string
                required: false
                description: e.g. Fire (same as Spell schools). Page headings add “Spells”.
              - name: utilityGroupId
                label: Utility group
                type: select
                required: false
                description: Set for utility spells; leave empty for main-school spells.
                options:
                  values:
                    - name: utility-ice
                      label: Ice
                    - name: utility-fire
                      label: Fire
                    - name: utility-lightning
                      label: Lightning
                    - name: utility-tempest-s-command
                      label: Tempest's Command
                    - name: utility-wind
                      label: Wind
                    - name: utility-radiant
                      label: Radiant
                    - name: utility-necrotic
                      label: Necrotic
              - name: utilityGroupName
                label: Utility group name
                type: string
                required: false
              - name: name
                label: Spell name
                type: string
                required: true
              - name: level
                label: Level (0 = cantrip)
                type: number
                required: true
                options:
                  min: 0
                  max: 9
              - name: actions
                label: Actions
                type: number
                required: false
                description: Heroic actions required. Omit only if using Casting note (e.g. 1 minute, 24 hours).
                options:
                  min: 1
              - name: castingNote
                label: Casting note
                type: text
                required: false
                description: Use when Actions is omitted (non-action cast time).
              - name: target
                label: Target
                type: select
                required: true
                options:
                  values:
                    - name: single-target
                      label: Single target
                    - name: self
                      label: Self
                    - name: aoe
                      label: AoE
                    - name: two-targets
                      label: 2 targets
                    - name: multi-target
                      label: Multi-target
                    - name: single-target-plus
                      label: Single target+
                    - name: single-target-or-self
                      label: Single target / self
              - name: body
                label: Rules
                type: rich-text
                required: true
                options:
                  format: markdown

      - name: core-rules-magic-items
        label: Magic items
        type: group
        items:
          - name: magical-item-rarities
            label: Rarities
            type: file
            path: src/data/magical-item-rarities.json
            format: json
            list: true
            fields:
              - name: name
                label: Rarity
                type: string
                required: true
              - name: availability
                type: text
                required: true
              - name: cost
                type: string
                required: true

          - name: magical-items
            label: Items
            type: file
            path: src/data/magical-items.json
            format: json
            list: true
            fields:
              - name: kind
                label: Type
                type: select
                required: true
                options:
                  values:
                    - name: standard
                      label: Standard item
                    - name: wand
                      label: Wand
              - name: name
                type: string
                required: true
              - name: subtitle
                label: Rarity / tier line
                type: string
                required: false
              - name: body
                label: Rules (markdown; use > for blockquotes)
                type: rich-text
                required: true
                options:
                  format: markdown

  - name: optional-variant-rules
    label: Optional variant rules
    type: file
    path: src/data/optional-variant-rules.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: rich-text
        required: true
        options:
          format: markdown
