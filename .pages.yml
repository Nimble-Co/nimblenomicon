# Pages CMS — https://pagescms.org/docs/configuration
# Media: https://pagescms.org/docs/configuration/media/
media:
  label: Assets
  input: src/assets
  output: /assets
  extensions: [avif, gif, jpeg, jpg, png, svg, webp]

content:
  - name: stats
    label: Stats
    type: file
    path: src/data/stats.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: stat
        label: Stat code
        type: string
        required: true
        description: Any short code you use for this stat (e.g. STR). Skills link to this value.
      - name: body
        type: text
        required: true

  - name: sizes
    label: Sizes
    type: file
    path: src/data/sizes.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: skills
    label: Skills
    type: file
    path: src/data/skills.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: stat
        label: Stat code
        type: string
        required: true
        description: Must exactly match the Stat code on a row in Stats (e.g. STR). Pages CMS cannot reference file+list collections yet; the build fails if the code is not in stats.json.
      - name: body
        type: text
        required: true
      - name: callout
        label: Callout
        type: rich-text
        required: false
        description: Optional note.
        options:
          format: html

  - name: conditions
    label: Conditions
    type: file
    path: src/data/conditions.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: weapon-properties
    label: Weapon Properties
    type: file
    path: src/data/weapon-properties.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true
      - name: callout
        label: Callout
        type: rich-text
        required: false
        description: Optional note.
        options:
          format: html

  - name: misc-adventuring-equipment
    label: Misc Adventuring Equipment
    type: file
    path: src/data/misc-adventuring-equipment.json
    format: json
    list: true
    fields:
      - name: item
        label: Item
        type: string
        required: true
      - name: properties
        label: Properties
        type: text
        required: true
      - name: cost
        label: Cost
        type: string
        required: true

  - name: weapons
    label: Weapons (tables)
    type: file
    path: src/data/weapons.json
    format: json
    list: true
    fields:
      - name: category
        label: Category
        type: select
        required: true
        description: Which weapons table this row belongs to.
        options:
          values:
            - name: melee
              label: Melee
            - name: ranged
              label: Ranged
      - name: item
        label: Item
        type: string
        required: true
      - name: damage
        label: Damage
        type: string
        required: true
      - name: properties
        label: Properties
        type: object
        list: true
        required: false
        description: One row per property; shown comma-separated in the table. Leave empty if none.
        fields:
          - name: text
            label: Text
            type: string
            required: true
      - name: cost
        label: Cost
        type: string
        required: true

  - name: core-rules-start-here
    label: Core Rules — Start Here
    type: file
    path: src/data/core-rules/start-here.md
