# Pages CMS — https://pagescms.org/docs/configuration
# Media: https://pagescms.org/docs/configuration/media/
media:
  label: Assets
  input: src/assets
  output: /assets
  extensions: [avif, gif, jpeg, jpg, png, svg, webp]

content:
  - name: stats
    label: Stats
    type: file
    path: src/data/stats.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: stat
        label: Stat code
        type: string
        required: true
        description: Any short code you use for this stat (e.g. STR). Skills link to this value.
      - name: body
        type: text
        required: true

  - name: sizes
    label: Sizes
    type: file
    path: src/data/sizes.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: skills
    label: Skills
    type: file
    path: src/data/skills.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: stat
        label: Stat code
        type: string
        required: true
        description: Must exactly match the Stat code on a row in Stats (e.g. STR). Pages CMS cannot reference file+list collections yet; the build fails if the code is not in stats.json.
      - name: body
        type: text
        required: true
      - name: callout
        label: Callout
        type: rich-text
        required: false
        description: Optional note.
        options:
          format: html

  - name: conditions
    label: Conditions
    type: file
    path: src/data/conditions.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: weapon-properties
    label: Weapon Properties
    type: file
    path: src/data/weapon-properties.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true
      - name: callout
        label: Callout
        type: rich-text
        required: false
        description: Optional note.
        options:
          format: html

  - name: misc-adventuring-equipment
    label: Misc Adventuring Equipment
    type: file
    path: src/data/misc-adventuring-equipment.json
    format: json
    list: true
    fields:
      - name: item
        label: Item
        type: string
        required: true
      - name: properties
        label: Properties
        type: text
        required: true
      - name: cost
        label: Cost
        type: string
        required: true

  - name: weapons
    label: Weapons (tables)
    type: file
    path: src/data/weapons.json
    format: json
    list: true
    fields:
      - name: category
        label: Category
        type: select
        required: true
        description: Which weapons table this row belongs to.
        options:
          values:
            - name: melee
              label: Melee
            - name: ranged
              label: Ranged
      - name: item
        label: Item
        type: string
        required: true
      - name: damage
        label: Damage
        type: string
        required: true
      - name: properties
        label: Properties
        type: object
        list: true
        required: false
        description: One row per property; shown comma-separated in the table. Leave empty if none.
        fields:
          - name: text
            label: Text
            type: string
            required: true
      - name: cost
        label: Cost
        type: string
        required: true

  - name: dc-examples
    label: Core Rules — DC examples
    type: file
    path: src/data/dc-examples.json
    format: json
    list: true
    fields:
      - name: html
        label: List item (HTML)
        type: rich-text
        required: true
        description: Full list item content including bold labels (matches Core Rules rendering).
        options:
          format: html

  - name: save-types
    label: Core Rules — Save types
    type: file
    path: src/data/save-types.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: downtime-activities
    label: Core Rules — Downtime activities
    type: file
    path: src/data/downtime-activities.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: character-classes
    label: Core Rules — Character classes
    type: file
    path: src/data/character-classes.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: stat-arrays
    label: Core Rules — Stat arrays
    type: file
    path: src/data/stat-arrays.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: languages
    label: Core Rules — Languages
    type: file
    path: src/data/languages.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: spell-schools
    label: Core Rules — Spell schools
    type: file
    path: src/data/spell-schools.json
    format: json
    list: true
    fields:
      - name: name
        type: string
        required: true
      - name: body
        type: text
        required: true

  - name: magical-item-rarities
    label: Core Rules — Magical item rarities
    type: file
    path: src/data/magical-item-rarities.json
    format: json
    list: true
    fields:
      - name: rarity
        type: string
        required: true
      - name: availability
        label: Typical availability
        type: text
        required: true
      - name: cost
        type: string
        required: true

  - name: spell-scroll-costs
    label: Core Rules — Spell scroll costs
    type: file
    path: src/data/spell-scroll-costs.json
    format: json
    list: true
    fields:
      - name: tier
        label: Spell tier
        type: string
        required: true
      - name: cost
        type: string
        required: true

  - name: wand-costs
    label: Core Rules — Wand costs
    type: file
    path: src/data/wand-costs.json
    format: json
    list: true
    fields:
      - name: tier
        label: Spell tier
        type: string
        required: true
      - name: cost
        type: string
        required: true

  - name: optional-variant-rules
    label: Core Rules — Optional variant rules
    type: file
    path: src/data/optional-variant-rules.json
    format: json
    list: true
    fields:
      - name: name
        label: Rule title
        type: string
        required: true
      - name: body
        type: text
        required: true
      - name: callout
        label: Callout
        type: rich-text
        required: false
        options:
          format: html

  - name: adventuring-motivations
    label: Core Rules — Adventuring motivations
    type: file
    path: src/data/adventuring-motivations.json
    format: json
    list: true
    fields:
      - name: html
        label: Paragraph (HTML)
        type: rich-text
        required: true
        options:
          format: html

  - name: core-rules-start-here
    label: Core Rules — Start Here
    type: file
    path: src/data/core-rules/start-here.md
