        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: stat
            label: Stat Code
            type: string
            required: true
            description: Must match a row in Stats. Build validates; CMS cannot link lists.
          - name: description
            label: Description
            type: rich-text
            required: true
            options:
              format: markdown

      - name: sizes
        label: Sizes
        type: file
        path: src/data/sizes.json
