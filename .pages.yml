              format: markdown

      - name: spell-scroll-costs
        label: Scroll Costs
        type: file
        path: src/data/spell-scroll-costs.json
        format: json
        list: true
        fields:
          - name: name
            label: Tier
            type: string
            required: true
          - name: cost
            label: Cost
            type: string
            required: true

      - name: wand-costs
        label: Wand Costs
        type: file
        path: src/data/wand-costs.json
        format: json
        list: true
        fields:
          - name: name
            label: Tier
            type: string
            required: true
          - name: cost
            label: Cost
            type: string
            required: true

      - name: spells
        label: Spells
        type: file
        path: src/data/spells.json
        format: json
        list: true
        fields:
          - name: schoolId
            label: School
            type: select
            required: true
            description: Same school for main spells and utility spells (e.g. utility Lightning spells use Lightning).
            options:
              values:
                - name: fire-spells
                  label: Fire
                - name: ice-spells
                  label: Ice
                - name: lightning-spells
                  label: Lightning
                - name: wind-spells
                  label: Wind
                - name: radiant-spells
                  label: Radiant
                - name: necrotic-spells
                  label: Necrotic
          - name: utility
            label: Utility Spell
            type: boolean
            required: true
            description: When enabled, the spell is listed under Utility Spells for this school.
          - name: name
            label: Name
            type: string
            required: true
            description: Detail page URL slug is generated from this name (kebab-case).
          - name: tier
            label: Spell Tier
            type: select
            required: true
            description: Stored as a number 0-9 in JSON (Cantrip = 0).
            options:
              values:
                - name: '0'
                  label: Cantrip
                - name: '1'
                  label: Tier 1
                - name: '2'
                  label: Tier 2
                - name: '3'
                  label: Tier 3
                - name: '4'
                  label: Tier 4
                - name: '5'
                  label: Tier 5
                - name: '6'
                  label: Tier 6
                - name: '7'
                  label: Tier 7
                - name: '8'
                  label: Tier 8
                - name: '9'
                  label: Tier 9
          - name: castingTime
            label: Casting Time
            type: string
            required: true
            description: Examples — 1 Action, 2 Actions, 24 Hours, Casting Time — 1 Minute.
          - name: target
            label: Target
            type: select
            required: true
            options:
              values:
                - name: single-target
                  label: Single Target
                - name: self
                  label: Self
                - name: aoe
                  label: AoE
                - name: two-targets
                  label: 2 Targets
                - name: multi-target
                  label: Multi-Target
                - name: single-target-plus
                  label: Single Target+
                - name: single-target-or-self
                  label: Single Target / Self
          - name: source
            label: Source
            type: select
            required: true
            options:
              values:
                - name: core-rules
                  label: Core Rules
                - name: game-masters-guide
                  label: Game Master's Guide
          - name: secret
            label: Secret Spell
            type: boolean
            required: true
            description: When enabled, the spell is listed under Secret Spells.
          - name: description
            label: Description
            type: rich-text
            required: true
            options:
              format: markdown

