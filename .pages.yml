# Pages CMS — https://pagescms.org/docs/configuration/
# Groups organize the sidebar. Rich-text uses format: markdown; MDX renders with renderMarkdown.

media:
  label: Assets
  input: src/assets
  output: /assets
  extensions: [avif, gif, jpeg, jpg, png, svg, webp]

content:
  - name: books
    label: Books
    type: group
    items:
      - name: core-rules
        label: Core Rules
        type: file
        path: src/content/docs/core-rules.mdx
        format: code
        options:
          format: mdx
      - name: game-masters-guide
        label: Game Master's Guide
        type: file
        path: src/content/docs/game-masters-guide.mdx
        format: code
        options:
          format: mdx
      - name: heroes
        label: Heroes
        type: file
        path: src/content/docs/heroes.mdx
        format: code
        options:
          format: mdx
      - name: adventures
        label: Adventures
        type: file
        path: src/content/docs/adventures.mdx
        format: code
        options:
          format: mdx
      - name: monsters-and-more
        label: Monsters & More
        type: file
        path: src/content/docs/monsters-and-more.mdx
        format: code
        options:
          format: mdx
      - name: creators-kit
        label: Creators Kit
        type: file
        path: src/content/docs/creators-kit.mdx
        format: code
        options:
          format: mdx

  - name: heroes-data
    label: Heroes Data
    type: group
    items:
      - name: hero-classes
        label: Hero Classes
        type: file
        path: src/data/hero-classes.json
        format: json
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: description
            label: Description
            type: rich-text
            required: true
            options:
              format: markdown
          - name: keyStats
            label: Key Stats
            type: object
            list: true
            required: true
            fields:
              - name: stat
                label: Stat
                type: string
                required: true
          - name: hitDie
            label: Hit Die
            type: string
            required: true
            description: e.g. d12 (displayed as 1d12).
          - name: startingHp
            label: Starting HP
            type: number
            required: true
          - name: saves
            label: Saves
            type: object
            required: true
            fields:
              - name: STR
                label: STR
                type: number
                required: true
              - name: DEX
                label: DEX
                type: number
                required: true
              - name: INT
                label: INT
                type: number
                required: true
              - name: WIL
                label: WIL
                type: number
                required: true
          - name: armor
            label: Armor
            type: object
            list: true
            required: false
            description: Empty list means none.
            fields:
              - name: name
                label: Armor Type
                type: string
                required: true
          - name: weapons
            label: Weapons
            type: object
            required: true
            description: Set exactly one of Stat weapons, Weapon kinds, or Range.
            fields:
              - name: type
                label: Stat Weapons
                type: string
                required: false
                description: e.g. STR or DEX — all weapons using that stat.
              - name: kind
                label: Weapon Kinds
                type: object
                list: true
                required: false
                fields:
                  - name: name
                    label: Kind
                    type: string
                    required: true
              - name: range
                label: Range
                type: string
                required: false
                description: e.g. melee for unarmed-only classes.
          - name: startingGear
            label: Starting Gear
            type: object
            list: true
            required: true
            fields:
              - name: name
                label: Item
                type: string
                required: true
          - name: levels
            label: Class Levels
            type: object
            list: true
            required: true
            fields:
              - name: level
                label: Level
                type: number
                required: true
              - name: abilities
                label: Abilities
                type: object
                list: true
                required: true
                fields:
                  - name: name
                    label: Name
                    type: string
                    required: true
                  - name: description
                    label: Description
                    type: rich-text
                    required: true
                    options:
                      format: markdown
          - name: abilityLists
            label: Ability Lists
            type: object
            list: true
            required: false
            fields:
              - name: name
                label: List Name
                type: string
                required: true
              - name: description
                label: Intro
                type: rich-text
                required: true
                options:
                  format: markdown
              - name: items
                label: Items
                type: object
                list: true
                required: true
                fields:
                  - name: name
                    label: Name
                    type: string
                    required: true
                  - name: description
                    label: Description
                    type: rich-text
                    required: true
                    options:
                      format: markdown
              - name: id
                label: Id
                type: string
                required: false
          - name: subclasses
            label: Subclasses
            type: object
            list: true
            required: true
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: levels
                label: Levels
                type: object
                list: true
                required: true
                fields:
                  - name: level
                    label: Level
                    type: number
                    required: true
                  - name: abilities
                    label: Abilities
                    type: object
                    list: true
                    required: true
                    fields:
                      - name: name
                        label: Name
                        type: string
                        required: true
                      - name: description
                        label: Description
                        type: rich-text
                        required: true
                        options:
                          format: markdown

  - name: game-masters-guide-data
    label: Game Master's Guide Data
    type: group
    items:
      - name: chaos-magic
        label: Chaos Table
        type: file
        path: src/data/chaos-magic.json
        format: json
        list: true
        fields:
          - name: roll
            label: d20 Roll
            type: number
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: description
            label: Description
            type: string
            required: true

      - name: gmg-gold-by-level
        label: Gold By Level
        type: file
        path: src/data/gmg-gold-by-level.json
        format: json
        list: true
        fields:
          - name: level
            label: Level
            type: number
            required: true
          - name: gold
            label: Gold
            type: number
            required: true

      - name: boons
        label: Boons
        type: file
        path: src/data/boons.json
        format: json
        list: true
        fields:
          - name: level
            label: Level
            type: select
            required: true
            description: Temporary = lodging 1d8 table; minor, major, epic = named boon list.
            options:
              values:
                - name: temporary
                  label: Temporary (1d8)
                - name: minor
                  label: Minor
                - name: major
                  label: Major
                - name: epic
                  label: Epic
          - name: roll
            label: d8 Roll
            type: number
            description: Required when Level is Temporary (1–8). Leave empty for named boons.
          - name: name
            label: Name
            type: string
            description: Required for Minor, Major, and Epic. Omit for Temporary rows.
          - name: description
            label: Description
            type: string
            required: true

      - name: gmg-monster-builder-levels
        label: Monster Builder Levels
        type: file
        path: src/data/gmg-monster-builder-levels.json
        format: json
        list: true
        fields:
          - name: level
            label: Monster Level
            type: string
            required: true
          - name: hpNoArmor
            label: HP No Armor
            type: number
            required: true
          - name: hpMediumArmor
            label: HP Medium Armor
            type: number
            required: true
          - name: hpHeavyArmor
            label: HP Heavy Armor
            type: number
            required: true
          - name: damagePerRound
            label: Damage Per Round
            type: number
            required: true
          - name: attackSampleDice
            label: Attack Sample Dice
            type: string
            required: true
          - name: saveDC
            label: Save DC
            type: number
            required: true
          - name: crEquivalent
            label: CR Equivalent
            type: string
            required: true

  - name: stats-skills
    label: Stats & Skills
    type: group
    items:
      - name: stats
        label: Stats
        type: file
        path: src/data/stats.json
