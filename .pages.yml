# Pages CMS — https://pagescms.org/docs/configuration/
# Use groups for sidebar navigation; format: code for large structured JSON edited as text.

media:
  label: Assets
  input: src/assets
  output: /assets
  extensions: [avif, gif, jpeg, jpg, png, svg, webp]

content:
  - name: core-rules
    label: Core Rules
    type: group
    items:
      - name: core-rules-intro
        label: Intro
        type: group
        items:
          - name: core-rules-start-here
            label: Start here
            type: file
            path: src/data/core-rules/start-here.md

      - name: core-rules-mechanics
        label: Mechanics
        type: group
        items:
          - name: stats
            label: Stats
            type: file
            path: src/data/stats.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: stat
                label: Stat code
                type: string
                required: true
                description: Short code (e.g. STR). Skills reference this value.
              - name: body
                type: text
                required: true

          - name: skills
            label: Skills
            type: file
            path: src/data/skills.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: stat
                label: Stat code
                type: string
                required: true
                description: Must match a Stat code in Stats (e.g. STR). Zod validates at build; CMS cannot link lists yet.
              - name: body
                type: text
                required: true
              - name: callout
                label: Callout
                type: rich-text
                required: false
                description: Optional HTML note.
                options:
                  format: html

          - name: sizes
            label: Sizes
            type: file
            path: src/data/sizes.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: text
                required: true

          - name: conditions
            label: Conditions
            type: file
            path: src/data/conditions.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: text
                required: true

      - name: core-rules-checks
        label: Checks & downtime
        type: group
        items:
          - name: dc-examples
            label: DC examples
            type: file
            path: src/data/dc-examples.json
            format: json
            list: true
            fields:
              - name: html
                label: List item
                type: rich-text
                required: true
                description: Full row HTML (bold labels).
                options:
                  format: html

          - name: save-types
            label: Save types
            type: file
            path: src/data/save-types.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: text
                required: true

          - name: downtime-activities
            label: Downtime activities
            type: file
            path: src/data/downtime-activities.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: text
                required: true

      - name: core-rules-character
        label: Character
        type: group
        items:
          - name: stat-arrays
            label: Stat arrays
            type: file
            path: src/data/stat-arrays.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: text
                required: true

          - name: languages
            label: Languages
            type: file
            path: src/data/languages.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: text
                required: true

          - name: character-classes
            label: Classes (step 1)
            type: file
            path: src/data/character-classes.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: text
                required: true

          - name: ancestries
            label: Ancestries
            type: file
            path: src/data/ancestries.json
            format: json
            list: true
            fields:
              - name: section
                type: select
                required: true
                options:
                  values:
                    - name: common
                      label: Common
                    - name: exotic
                      label: Exotic
              - name: name
                type: string
                required: true
              - name: sizeLine
                label: Size line
                type: string
                required: true
              - name: flavor
                type: text
                required: true
              - name: trait
                label: Trait
                type: text
                required: true
                description: Markdown (bold ability name, etc.).
              - name: callout
                label: Callout
                type: rich-text
                required: false
                options:
                  format: html

          - name: backgrounds
            label: Backgrounds
            type: file
            path: src/data/backgrounds.json
            format: json
            list: true
            fields:
              - name: body
                label: Segment
                type: text
                required: true
                description: One background or callout block; order matches the page.

          - name: adventuring-motivations
            label: Adventuring motivations
            type: file
            path: src/data/adventuring-motivations.json
            format: json
            list: true
            fields:
              - name: html
                label: Paragraph
                type: rich-text
                required: true
                options:
                  format: html

      - name: core-rules-equipment
        label: Equipment
        type: group
        items:
          - name: weapons
            label: Weapons
            type: file
            path: src/data/weapons.json
            format: json
            list: true
            fields:
              - name: category
                label: Table
                type: select
                required: true
                options:
                  values:
                    - name: melee
                      label: Melee
                    - name: ranged
                      label: Ranged
              - name: item
                label: Item
                type: string
                required: true
              - name: damage
                label: Damage
                type: string
                required: true
              - name: properties
                label: Properties
                type: object
                list: true
                required: false
                description: One entry per property; shown comma-separated.
                fields:
                  - name: text
                    label: Text
                    type: string
                    required: true
              - name: cost
                label: Cost
                type: string
                required: true

          - name: weapon-properties
            label: Weapon properties
            type: file
            path: src/data/weapon-properties.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: text
                required: true
              - name: callout
                label: Callout
                type: rich-text
                required: false
                options:
                  format: html

          - name: armor
            label: Armor
            type: file
            path: src/data/armor.json
            format: json
            list: true
            fields:
              - name: category
                label: Section
                type: select
                required: true
                options:
                  values:
                    - name: cloth
                      label: Cloth
                    - name: leather
                      label: Leather
                    - name: plate
                      label: Plate
                    - name: mail
                      label: Mail
                    - name: shields
                      label: Shields
              - name: item
                label: Item
                type: string
                required: true
              - name: armor
                label: Armor
                type: string
                required: true
              - name: cost
                type: string
                required: true

          - name: misc-adventuring-equipment
            label: Misc. adventuring gear
            type: file
            path: src/data/misc-adventuring-equipment.json
            format: json
            list: true
            fields:
              - name: item
                label: Item
                type: string
                required: true
              - name: properties
                label: Properties
                type: text
                required: true
              - name: cost
                label: Cost
                type: string
                required: true

      - name: core-rules-spells
        label: Spells
        type: group
        items:
          - name: spell-schools
            label: School intros
            type: file
            path: src/data/spell-schools.json
            format: json
            list: true
            fields:
              - name: name
                type: string
                required: true
              - name: body
                type: text
                required: true

          - name: spell-scroll-costs
            label: Scroll costs
            type: file
            path: src/data/spell-scroll-costs.json
            format: json
            list: true
            fields:
              - name: tier
                label: Tier
                type: string
                required: true
              - name: cost
                type: string
                required: true

          - name: wand-costs
            label: Wand costs
            type: file
            path: src/data/wand-costs.json
            format: json
            list: true
            fields:
              - name: tier
                label: Tier
                type: string
                required: true
              - name: cost
                type: string
                required: true

          - name: spells
            label: Spell compendium
            type: file
            path: src/data/spells.json
            format: code
            description: >
              Schools, utility schools, and every spell. Each spell has level (0 = cantrip),
              actions (number or null with castingNote), target, body. Edit carefully—invalid JSON breaks the build.

      - name: core-rules-magic-items
        label: Magic items
        type: group
        items:
          - name: magical-item-rarities
            label: Rarity table
            type: file
            path: src/data/magical-item-rarities.json
            format: json
            list: true
            fields:
              - name: rarity
                type: string
                required: true
              - name: availability
                label: Typical availability
                type: text
                required: true
              - name: cost
                type: string
                required: true

          - name: magical-items
            label: Items & wands
            type: file
            path: src/data/magical-items.json
            format: code
            description: >
              Discriminated list (standard items vs wands). Structured JSON—use code editor.

      - name: core-rules-options
        label: Options
        type: group
        items:
          - name: optional-variant-rules
            label: Variant rules
            type: file
            path: src/data/optional-variant-rules.json
            format: json
            list: true
            fields:
              - name: name
                label: Title
                type: string
                required: true
              - name: body
                type: text
                required: true
              - name: callout
                label: Callout
                type: rich-text
                required: false
                options:
                  format: html
