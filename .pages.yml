            type: select
            required: true
            description: Fractional levels for minions; 1–20 for full creatures.
            options:
              values:
                - name: '1/4'
                  label: '1/4'
                - name: '1/3'
                  label: '1/3'
                - name: '1/2'
                  label: '1/2'
                - name: '1'
                  label: '1'
                - name: '2'
                  label: '2'
                - name: '3'
                  label: '3'
                - name: '4'
                  label: '4'
                - name: '5'
                  label: '5'
                - name: '6'
                  label: '6'
                - name: '7'
                  label: '7'
                - name: '8'
                  label: '8'
                - name: '9'
                  label: '9'
                - name: '10'
                  label: '10'
                - name: '11'
                  label: '11'
                - name: '12'
